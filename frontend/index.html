<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heat Seek - Word Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>
          <span class="title-hot">Heat</span>
          <span class="title-cold">Seek</span>
        </h1>
        <p>
          Guess the word and see how close you are:
          <span class="text-hot">hot</span>, <span class="text-warm">warm</span>, or
          <span class="text-cold">ice cold</span>.
        </p>
      </header>

      <main class="game-container">
        <form id="guess-form" autocomplete="off">
          <div class="input-wrapper">
            <input
              type="text"
              id="guess-input"
              placeholder="Type a word..."
              aria-label="Your guess"
              required
              disabled
            />
            <span id="guess-counter-badge">#1</span>

            <div class="menu-dropdown">
              <button
                type="button"
                id="menu-toggle-btn"
                class="menu-icon-btn"
                aria-label="Options"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="menu-options"
              >
                ⋮
              </button>
              <div id="menu-options" class="dropdown-content hidden">
                <button type="button" id="hint-btn">💡 Get Hint</button>
                <button type="button" id="giveup-btn" class="danger-btn">🏳️ Give Up</button>
                <button type="button" id="newword-btn" hidden>🔁 New Word</button>
              </div>
            </div>
          </div>
        </form>

        <div id="latest-guess-container" aria-live="polite"></div>

        <hr id="guess-divider" class="guess-divider hidden" />

        <div id="hint-display-container" aria-live="polite"></div>
        <div id="guess-list" class="guess-list"></div>
      </main>
    </div>

    <div id="game-modal" class="win-modal-overlay hidden">
      <div class="win-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-header">
        <div id="modal-header" class="win-modal-header">YOU WON!</div>
        <div class="win-modal-body">
          <div class="modal-word-label">THE WORD WAS</div>
          <div id="modal-target-word" class="modal-word-reveal">TARGET</div>

          <div class="modal-stats-grid">
            <div class="modal-stat-box">
              <div class="stat-label">GUESSES</div>
              <div id="modal-stat-guesses" class="stat-value">0</div>
            </div>
            <div class="modal-stat-box">
              <div class="stat-label">HINTS USED</div>
              <div id="modal-stat-hints" class="stat-value">0</div>
            </div>
          </div>
        </div>
        <div class="win-modal-footer">
          <button id="modal-replay-btn" class="modal-btn primary-btn">Play Again</button>
          <button id="modal-close-btn" class="modal-btn secondary-btn">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Deploy only if lint, type-check, tests and build pass.
  ci:
    uses: ./.github/workflows/ci.yml

  call-deploy:
    needs: ci
    uses: christianbihasa/dev-toolkit/.github/workflows/deploy.yml@main
    with:
      working-directory: './frontend'
      build-path: './frontend/dist'
      node-version: '24'

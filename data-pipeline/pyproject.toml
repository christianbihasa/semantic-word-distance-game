[project]
name = "heat-seek-data-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
